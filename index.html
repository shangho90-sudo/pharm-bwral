<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PHARMA BRAWL</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#091223;color:#eff8fa;font-family:system-ui,sans-serif;overflow:hidden}header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #203647}strong{font-size:16px;letter-spacing:2px}strong span{color:#53d6bd}small{color:#9bb4c6}button{border:1px solid #375269;background:#13273c;color:white;padding:6px 14px;cursor:pointer}#arena{height:calc(100dvh - 48px);position:relative}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#091223}#loading h1{font-size:clamp(28px,5vw,70px);letter-spacing:4px;margin:0 0 20px}#loading p{color:#9bb4c6}.track{width:280px;height:6px;background:#21364a}.bar{height:100%;width:0;background:#53d6bd;transition:width .15s}#error{position:absolute;top:20px;left:10%;right:10%;background:#96374a;padding:16px;display:none}@media(max-width:750px){header{padding:0 12px}small{display:none}strong{font-size:13px}}
    #arena{display:flex;align-items:center;justify-content:center}#frame{width:min(100vw,calc((100dvh - 48px)*1.77778));aspect-ratio:16/9;position:relative}
  </style>
</head>
<body>
  <header><strong>PHARMA <span>BRAWL</span></strong><small>4 ARENAS · WASD 이동 / 마우스 조준 / LMB 공격 / RMB 스킬 / SPACE 궁극기</small><button id="full">전체 화면</button></header>
  <main id="arena"><div id="frame"><canvas id="unity-canvas" width="1600" height="900" tabindex="0"></canvas><div id="loading"><h1>PHARMA BRAWL</h1><p>약국 아레나를 준비하고 있습니다</p><div class="track"><div class="bar" id="bar"></div></div><p>Unity WebGL prototype</p></div><div id="error"></div></div></main>
  <script src="Build/PharmaBrawl-Web.loader.js"></script>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const config={dataUrl:'Build/PharmaBrawl-Web.data.unityweb',frameworkUrl:'Build/PharmaBrawl-Web.framework.js.unityweb',codeUrl:'Build/PharmaBrawl-Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Pharma Brawl Prototype',productName:'PHARMA BRAWL',productVersion:'0.2',devicePixelRatio:Math.min(2,window.devicePixelRatio||1),showBanner:(message,type)=>{if(type==='error'){let e=document.getElementById('error');e.textContent=message;e.style.display='block';}else console.log(message)}};
    createUnityInstance(canvas,config,p=>document.getElementById('bar').style.width=(p*100)+'%').then(instance=>{document.getElementById('loading').remove();canvas.focus();document.getElementById('full').onclick=()=>instance.SetFullscreen(1)}).catch(error=>{const e=document.getElementById('error');e.textContent=String(error);e.style.display='block'});
  </script>
</body>
</html>
